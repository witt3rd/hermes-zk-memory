[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-zk-memory"
version = "0.1.0"
description = "Zettelkasten-backed memory provider for Hermes Agent — thin adapter over the host-agnostic zk-memory library."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️ & Donald", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    "zk-memory[lancedb] @ git+https://github.com/witt3rd/zk-memory.git@v0.4.0",
]

[project.urls]
Homepage = "https://github.com/witt3rd/hermes-zk-memory"
Repository = "https://github.com/witt3rd/hermes-zk-memory"
Issues = "https://github.com/witt3rd/hermes-zk-memory/issues"

[project.entry-points."hermes_agent.memory_providers"]
zk-memory = "hermes_zk_memory:register"

[project.optional-dependencies]
# Rich full-text recall lives in zk-memory's optional `lancedb` extra.
# Install `zk-memory[lancedb]` to enable it; otherwise search degrades
# to a `rg`-based fallback.
test = ["pytest>=7"]

[tool.pytest.ini_options]
# The plugin root carries __init__.py (loaded as a package by hermes). Collect
# only tests/ so pytest never imports the root __init__.py flat (whose relative
# sibling imports would fail without a package parent).
testpaths = ["tests"]

[tool.setuptools]
packages = ["hermes_zk_memory"]