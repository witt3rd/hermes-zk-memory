[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-zk-memory"
version = "0.1.0"
description = "Zettelkasten-backed memory provider for Hermes Agent — thin adapter over the host-agnostic zk-memory library."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️ & Donald", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    "zk-memory @ git+https://github.com/witt3rd/zk-memory.git@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/witt3rd/hermes-zk-memory"
Repository = "https://github.com/witt3rd/hermes-zk-memory"
Issues = "https://github.com/witt3rd/hermes-zk-memory/issues"

[project.optional-dependencies]
# Rich full-text recall lives in zk-memory's optional `lancedb` extra.
# Install `zk-memory[lancedb]` to enable it; otherwise search degrades
# to a `rg`-based fallback.
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["__init__", "llm"]