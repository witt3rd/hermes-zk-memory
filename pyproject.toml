[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-zk-memory"
version = "0.1.0"
description = "Zettelkasten-backed memory provider for Hermes Agent — one atomic note per thought, judged at write time, recalled by search."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️ & Donald", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/witt3rd/hermes-zk-memory"
Repository = "https://github.com/witt3rd/hermes-zk-memory"
Issues = "https://github.com/witt3rd/hermes-zk-memory/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["__init__"]
